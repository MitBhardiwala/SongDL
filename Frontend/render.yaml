services:
  - type: web
    name: songdl-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://song-downloader-backend-xbgu.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html